<!DOCTYPE html>
<!--
  Programación Web Creativa II · Taller: Lista de tareas interactiva con JavaScript
  Autores: Jhonnier Santiago Giraldo y Darién Alonso
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="17_lista_tareas.css">
</head>
<body>
  <main class="app">
    <h1>Lista de tareas</h1>

    <form id="formTarea" class="formulario">
      <label for="inputTarea" class="sr-only">Nueva tarea</label>
      <input type="text" id="inputTarea" placeholder="Escribe una tarea..."
        maxlength="80" autocomplete="off" required>
      <button type="submit">Agregar</button>
    </form>

    <ul id="listaTareas"></ul>
    <p id="mensajeVacio" aria-live="polite">No hay tareas pendientes. ¡Agrega la primera!</p>
  </main>

  <script src="18_lista_tareas.js"></script>
</body>
</html>
