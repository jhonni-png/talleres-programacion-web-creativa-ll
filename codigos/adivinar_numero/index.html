<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el número</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="juego">
    <h1>Adivina el número</h1>
    <p class="subtitulo">Estoy pensando en un número entre 1 y 100.</p>

    <form id="formulario" class="formulario">
      <label for="intento">Tu intento</label>
      <div class="campo">
        <input type="number" id="intento" min="1" max="100"
               placeholder="1 - 100" autocomplete="off" required>
        <button type="submit" id="btn-probar">Probar</button>
      </div>
    </form>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite">
      ¡Buena suerte!
    </p>

    <div class="marcador">
      <span>Intentos:</span>
      <strong id="contador">0</strong>
    </div>

    <button type="button" id="btn-nueva" class="secundario">Nueva partida</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
